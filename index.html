<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pengumuman Kelulusan</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1f650d, #4373a0);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Glow */
        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            filter: blur(50px);
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -120px;
            right: -100px;
            filter: blur(50px);
        }

        .main-card {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 40px;
            color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease;
            position: relative;
            z-index: 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 10px;
        }

        .form-control {
            height: 55px;
            border: none;
            border-radius: 16px;
            padding: 0 20px;
            font-size: 1rem;
            box-shadow: none !important;
        }

        .btn-custom {
            background: linear-gradient(135deg, #ff8a00, #ff0058);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 16px;
            padding: 0 28px;
            transition: 0.3s;
            height: 55px;
        }

        .btn-custom:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 0, 88, 0.3);
        }

        .result-card {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: fadeIn 0.5s ease;
        }

        .result-title {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .label {
            color: rgba(255, 255, 255, 0.75);
        }

        .value {
            font-weight: 600;
        }

        .status-badge {
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-block;
        }

        .lulus {
            background: #28c76f;
            color: white;
        }

        .tidak-lulus {
            background: #ea5455;
            color: white;
        }

        .error-alert {
            margin-top: 25px;
            background: rgba(234, 84, 85, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            display: none;
        }

        .custom-group {
            display: flex;
            gap: 12px;
        }

        .custom-group .form-control {
            flex: 1;
        }

        @media(max-width:576px) {

            .main-card {
                padding: 28px 22px;
            }

            .title {
                font-size: 1.5rem;
            }

            .custom-group {
                flex-direction: column;
            }

            .btn-custom {
                width: 100%;
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="main-card">
        <img src="/Picture1.png" alt="Logo Sekolah" class="mb-4"
            style="width: 120px; display: block; margin-left: auto; margin-right: auto;">
        <h1 class="title">🎓 Pengumuman Kelulusan</h1>

        <p class="subtitle">
            Masukkan nama lengkap siswa untuk melihat hasil kelulusan.
        </p>

        <div class="mb-3">
            <label class="form-label">
                Nama Lengkap Siswa(kapital semua)
            </label>

            <div class="custom-group">
                <input type="text" id="studentIdInput" class="form-control" placeholder="Contoh: PARK JISUNG">

                <button onclick="cekKelulusan()" class="btn-custom">
                    Cek Sekarang
                </button>
            </div>
        </div>

        <!-- RESULT -->
        <div id="resultCard" class="result-card d-none">

            <h5 class="result-title">
                ✨ Hasil Kelulusan
            </h5>

            <div class="info-row">
                <span class="label">Nama Siswa</span>
                <span id="resName" class="value">-</span>
            </div>

            <div class="info-row">
                <span class="label">Status</span>

                <span id="resStatus" class="status-badge">
                    -
                </span>
            </div>

        </div>

        <!-- ERROR -->
        <div id="errorAlert" class="error-alert">
            ❌ Nama siswa tidak ditemukan. Silakan cek kembali.
        </div>

    </div>

    <script>

        // Database siswa
        const dataSiswa = {

            "ADERA": {
                nama: "ADERA",
                status: "LULUS"
            },

            "AIRLANGGA ALBI AL MA'RUFI": {
                nama: "AIRLANGGA ALBI AL MA'RUFI",
                status: "LULUS"
            },

            "AQYLA RUNA AZZAHWA": {
                nama: "AQYLA RUNA AZZAHWA",
                status: "LULUS"
            },

            "ARINAL HUSNA": {
                nama: "ARINAL HUSNA",
                status: "LULUS"
            },

            "ASSYIFA AULIA AZZAHRA": {
                nama: "ASSYIFA AULIA AZZAHRA",
                status: "LULUS"
            },

            "AULIYA NAJWA KHAIRINA": {
                nama: "AULIYA NAJWA KHAIRINA",
                status: "LULUS"
            },

            "AZIZAH ANGGI AZ-ZAHRA": {
                nama: "AZIZAH ANGGI AZ-ZAHRA",
                status: "LULUS"
            },

            "JESSICA DIRLY AULIA PUTRI ASTARI": {
                nama: "JESSICA DIRLY AULIA PUTRI ASTARI",
                status: "LULUS"
            },

            "MAHELGA RAFEL PUTRA EDIVENIO": {
                nama: "MAHELGA RAFEL PUTRA EDIVENIO",
                status: "LULUS"
            },

            "MUHAMMAD IQBAL AL DRIAN": {
                nama: "MUHAMMAD IQBAL AL DRIAN",
                status: "LULUS"
            },

            "MUHAMMAD KIKI ADITYA PUTRA": {
                nama: "MUHAMMAD KIKI ADITYA PUTRA",
                status: "LULUS"
            },

            "MUHAMMAD NUR WAHID": {
                nama: "MUHAMMAD NUR WAHID",
                status: "LULUS"
            },

            "NACUWHA AGNES PUTRI RENATA": {
                nama: "NACUWHA AGNES PUTRI RENATA",
                status: "LULUS"
            },

            "NADIRA SAFA ELYSIA": {
                nama: "NADIRA SAFA ELYSIA",
                status: "LULUS"
            },

            "NADYA NURROHMAH": {
                nama: "NADYA NURROHMAH",
                status: "LULUS"
            },

            "NAILATUL MUFIROH": {
                nama: "NAILATUL MUFIROH",
                status: "LULUS"
            },

            "RAIHANIA XENAYA": {
                nama: "RAIHANIA XENAYA",
                status: "LULUS"
            },

            "REYCO PUTRA WAHYU ARTADINATA": {
                nama: "REYCO PUTRA WAHYU ARTADINATA",
                status: "LULUS"
            },

            "SENSA PRENTIK ERGIYANA": {
                nama: "SENSA PRENTIK ERGIYANA",
                status: "LULUS"
            },

            "ABYAN DEVANO AKHTAR": {
                nama: "ABYAN DEVANO AKHTAR",
                status: "LULUS"
            },

            "AFIQA SALSABILA": {
                nama: "AFIQA SALSABILA",
                status: "LULUS"
            },

            "ALALA NIDA UMMULKHUMAIRO'": {
                nama: "ALALA NIDA UMMULKHUMAIRO'",
                status: "LULUS"
            },

            "ANINDITA KEISYA ZAHRA": {
                nama: "ANINDITA KEISYA ZAHRA",
                status: "LULUS"
            },

            "AQYLA WINDYA FAHMA": {
                nama: "AQYLA WINDYA FAHMA",
                status: "LULUS"
            },

            "AZIZATUS SOLIKHAH": {
                nama: "AZIZATUS SOLIKHAH",
                status: "LULUS"
            },

            "HAURA ADINDA PUTRI": {
                nama: "HAURA ADINDA PUTRI",
                status: "LULUS"
            },

            "MUHAMMAD HUSNI MUBAROK": {
                nama: "MUHAMMAD HUSNI MUBAROK",
                status: "LULUS"
            },

            "MUHAMMAD KAVABILLAH QOSHIDUL HAQQ": {
                nama: "MUHAMMAD KAVABILLAH QOSHIDUL HAQQ",
                status: "LULUS"
            },

            "MUHAMMAD SYAFII'UL ALIM": {
                nama: "MUHAMMAD SYAFII'UL ALIM",
                status: "LULUS"
            },

            "NAFIA MIFTAKUL HUSNA": {
                nama: "NAFIA MIFTAKUL HUSNA",
                status: "LULUS"
            },

            "NAURA AZ ZAHRA PUTRI AORORA": {
                nama: "NAURA AZ ZAHRA PUTRI AORORA",
                status: "LULUS"
            },

            "NOVITA DEWII": {
                nama: "NOVITA DEWII",
                status: "LULUS"
            },

            "RIDWAN MAULANA NUR CAHYA PRATAMA": {
                nama: "RIDWAN MAULANA NUR CAHYA PRATAMA",
                status: "LULUS"
            },

            "SEPTIANI WULANDARI": {
                nama: "SEPTIANI WULANDARI",
                status: "LULUS"
            },

            "SHERLY FLORENA": {
                nama: "SHERLY FLORENA",
                status: "LULUS"
            },

            "TRI INDRA WAHYU SEJATI": {
                nama: "TRI INDRA WAHYU SEJATI",
                status: "LULUS"
            },

            "VANDI SLAMET TRI WIBOWO": {
                nama: "VANDI SLAMET TRI WIBOWO",
                status: "LULUS"
            }

        };

        function cekKelulusan() {

            const inputId = document
                .getElementById("studentIdInput")
                .value
                .trim();

            const resultCard = document.getElementById("resultCard");
            const errorAlert = document.getElementById("errorAlert");

            const resName = document.getElementById("resName");
            const resStatus = document.getElementById("resStatus");

            // reset
            resultCard.classList.add("d-none");
            errorAlert.style.display = "none";

            // validasi kosong
            if (inputId === "") {
                alert("Masukkan ID siswa terlebih dahulu!");
                return;
            }

            // cek data
            if (dataSiswa[inputId]) {

                const siswa = dataSiswa[inputId];

                resName.innerText = siswa.nama;
                resStatus.innerText = siswa.status;

                if (siswa.status === "LULUS") {

                    resStatus.className =
                        "status-badge lulus";

                } else {

                    resStatus.className =
                        "status-badge tidak-lulus";
                }

                resultCard.classList.remove("d-none");

            } else {

                errorAlert.style.display = "block";
            }
        }

        // ENTER keyboard support
        document
            .getElementById("studentIdInput")
            .addEventListener("keypress", function (e) {

                if (e.key === "Enter") {
                    cekKelulusan();
                }

            });

    </script>

</body>

</html>
